title: 
    en: Climate and Health
    fr: Climat et Santé
description: 
    en: |
        <p>
        The <strong>Climate and Health Maproom</strong> enable users to analyze historical climate data, current conditions, and future climate forecasts and projections to better understand and manage climate-sensitive health risks. 
        </p>
        <p>
        This Maproom supports the monitoring and prediction of climate conditions that influence the occurrence and spread of climate-sensitive diseases. Empirically derived thresholds of precipitation, temperature and relative humidity are used to assess the climatic suitability of malaria transmission.
        </p>
        <p>
        While the current Maproom focuses primarily on malaria and historical climate information, it is designed to evolve into a more comprehensive platform that supports a broader range of climate-sensitive diseases and health outcomes.
        </p>
        <p>
        Future enhancements are expected to incorporate near-real-time climate monitoring, seasonal forecasts, and longer-term climate projections, enabling more proactive health risk assessment and early warning. 
        </p>
    fr: |
        <p>
        La <strong>Maproom Climat et Santé</strong> permet aux utilisateurs d’analyser les données climatiques historiques, les conditions actuelles ainsi que les prévisions et projections climatiques futures afin de mieux comprendre et gérer les risques sanitaires liés au climat.
        </p>
        <p>
        Cette Maproom facilite le suivi et la prévision des conditions climatiques qui influencent l’apparition et la propagation des maladies sensibles au climat. Des seuils de précipitations, de température et d’humidité relative déterminés de manière empirique sont utilisés pour évaluer si les conditions climatiques sont favorables à la transmission du paludisme.
        </p>
        <p>
        Bien que la Maproom actuelle porte principalement sur le paludisme et les informations climatiques historiques, elle est conçue pour évoluer vers une plateforme plus complète couvrant un éventail plus large de maladies sensibles au climat et d’effets sur la santé.
        </p>
        <p>
        Les améliorations futures devraient intégrer le suivi climatique en temps quasi réel, les prévisions saisonnières et les projections climatiques à plus long terme, afin de permettre une évaluation plus proactive des risques sanitaires et la mise en place de systèmes d’alerte précoce.
        </p>
