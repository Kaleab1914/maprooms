            fr: Année de début
        end_year:
            en: End year
            fr: Année de fin
        minimum_years:
            en: Minimum valid years
            fr: Nombre minimum d'années
        chart_period:
            en: Chart period
            fr: Période du graphique

        start_month:
            en: Starting month and year
            fr: Mois et année de début

        chart_area:
            en: Chart spatial average
