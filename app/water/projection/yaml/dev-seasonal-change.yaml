        label: ACCESS-CM2
    inm_cm5_0:
        label: INM-CM5-0
    miroc_es2l:
        label: MIROC_ES2L
    mpi_esm1_2_lr:
        label: MPI-ESM1-2-LR
    mri_esm2_0:
        label: MRI-ESM2-0
    noresm2_mm:
        label: NorESM2-MM

scenarios:
