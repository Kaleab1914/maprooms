dataset:
    historical:
        dataset: HIST
    projection:
        dataset: PROJ
    variables:
        rainfall: [precip]

GCM:
    access_cm2:
        label: ACCESS-CM2
    inm_cm5_0:
        label: INM-CM5-0
    miroc_es2l:
        label: MIROC-ES2L
    mpi_esm1_2_hr:
        label: MPI-ESM1-2-HR
    mpi_esm1_2_lr:
        label: MPI-ESM1-2-LR
    mri_esm2_0:
        label: MRI-ESM2-0
    noresm2_mm:
        label: NorESM2-MM

scenarios:
    ssp1_2_6:
        label: SSP1-2.6
    ssp2_4_5:
        label: SSP2-4.5
    ssp3_7_0:
        label: SSP3-7.0
    ssp5_8_5:
        label: SSP5-8.5

opt_inputs:
    GCM:
        label:
            en: Global climate model
            fr: Modèle climatique global
        default: access_cm2

    scenarios:
        label:
            en: Scenario
            fr: Scénario
        default: ssp2_4_5

    map_month:
        label:
            en: Map accumulation period
            fr: Période de cumul de la carte

map_month:
    projection: "2015-01"

plot_period:
    start_year: 1981
    end_year: 2100

spi_settings:
    distribution: gamma
    length: 3

spi_chart_label:
    en: Monthly SPI
    fr: SPI mensuel

spi_controls:
    start_month:
        en: Start month
        fr: Mois de début

    length:
        en: Length
        fr: Durée

    plot_period:
        en: Chart display period
        fr: Période affichée du graphique

    start_year:
        en: Start year
        fr: Année de début

    end_year:
        en: End year
        fr: Année de fin

    distribution:
        en: Distribution
        fr: Distribution

    months:
        en: months
        fr: mois

spi_distributions:
    gamma:
        en: Gamma
        fr: Gamma

    peasron3:
        en: Pearson Type III
        fr: Pearson Type III