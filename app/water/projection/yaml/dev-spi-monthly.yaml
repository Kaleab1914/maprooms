dataset:
    historical:
        dataset: HIST
    projection:
        dataset: PROJ


regional_models:
    CLMcom-CCLM4:
        label: CLMcom-CCLM4
        value: ".CLMcom-CCLM4-8-17_v1"
        gcm:
            - CNRM-CM5
            - EC-EARTH

    SMHI-RCA4:
        label: SMHI-RCA4
        value: ".SMHI-RCA4_v1"
        gcm:
            - CNRM-CM5

GCM:
    CNRM-CM5:
        label: CNRM-CERFACS-CNRM-CM5
        value: ".CNRM-CERFACS-CNRM-CM5_r1i1p1"

    EC-EARTH:
        label: ICHEC-EC-EARTH
        value: ".ICHEC-EC-EARTH_r12i1p1"

scenarios:
    Hist:
        label: Hist
        value: Hist

    SSP2:
        label: SSP2
        value: SSP2

    SSP8:
        label: SSP8
        value: SSP8


opt_inputs:
    regional_models:
        label: Regional climate model
        default: CLMcom-CCLM4
    GCM:
        label: Global climate model
        default: CNRM-CM5
    scenarios:
        label: Scenario
        default: Hist
    time_period:
        label: SPI time period

time_period:
    start:
        label: Start year
        value: 1951
    end:
        label: End year
        value: 2100

