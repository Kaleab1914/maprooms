soilgrids:
    base_url: "https://files.isric.org/public/gyga/GYGA_Results"
    tawc:
        agg_erzd:
            name: tawc_agg_erzd
            file: "gyga_af_agg_erzd_tawcpf23mm__m_1km.tif"
            long_name: Absolute total available water capacity (mm), aggregated over the Effective Root Zone Depth for Maize
        agg_30cm:
            name: tawc_agg_30cm
            file: "gyga_af_agg_30cm_tawcpf23mm__m_1km.tif"
            long_name: Absolute total available water capacity (mm), aggregated over the top 30 cm
    files_dir: /home/aranaivoson/ENACTS/DATA/SOILGRIDS/FILES
    zarr_dir: /home/aranaivoson/ENACTS/DATA/SOILGRIDS/ZARR
    chunks:
        lat: 50
        lon: 50

geom_layers:
    shp_dir: /home/enacts/SHP
forecast_data:
    seasonal:
        rainfall: /home/enacts/FORECASTS/SEASONAL_PRECIP
        temperature: /home/enacts/FORECASTS/SEASONAL_TEMP
    shp_dir: /home/aranaivoson/ENACTS/DATA/SHP

climate_projection:
    netcdf_dir: /mnt/d/ASA/Data_test/NEW/CMIP6_CDS_COMBINED

    zarr_dir: /home/aranaivoson/ENACTS/DATA/CMIP6/ZARR

    chunks:
        time: 365
        lat: 32
        lon: 32

    variables:
        maximum_temperature: tasmax
        rainfall: pr
        minimum_temperature: tasmin

    netcdf:
        tasmax:
            name: Daily maximum temperature
            folder: TASMAX
            varid: tasmax
            lon: lon
            lat: lat
            time: time
            units: K

        pr:
            name: Daily precipitation
            folder: PR
            varid: pr
            lon: lon
            lat: lat
            time: time
            units: kg m-2 s-1

        tasmin:
            name: Daily minimum temperature
            folder: TASMIN
            varid: tasmin
            lon: lon
            lat: lat
            time: time
            units: K

    historical:
        dataset: HIST
        directory: Historical
        file_pattern: "{folder}/Historical/{model}/{model}_historical_{varid}_*.nc"

    projection:
        dataset: PROJ
        directory: Projection
        file_pattern: "{folder}/Projection/{model}/{scenario}/{model}_{scenario}_{varid}_*.nc"

    scenarios:
        ssp1_2_6:
            label: SSP1-2.6
        ssp2_4_5:
            label: SSP2-4.5
        ssp3_7_0:
            label: SSP3-7.0
        ssp5_8_5:
            label: SSP5-8.5

    bbox:
        minLon: 30.625
        maxLon: 50.375
        minLat: 0.625
        maxLat: 17.375

