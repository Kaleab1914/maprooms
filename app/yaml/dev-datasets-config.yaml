
datasets:
    ALL:
        variables:
            rainfall: precip
            maximum_temperature: tmax
            minimum_temperature: tmin
            reference_evapotranspiration: et0
            potential_evapotranspiration: pet
        daily:
            # compute: False
            netcdf:
                precip: 
                    dir: /home/aranaivoson/ENACTS/DATA/ENACTS/NETCDF/ALL/rr_daily
                    format: chirps-v2_%Y%m%d.nc
                    name: Daily rainfall
                    varid: precip
                    lon: Lon
                    lat: Lat
                    time: Time
                    prec: float
                    units: mm
                    missval: -99
                    compute: False
                tmax: 
                    dir: /home/aranaivoson/ENACTS/DATA/ENACTS/NETCDF/ALL/tmax_daily
                    format: era5_%Y%m%d.nc
                    name: Daily maximum temperature
                    varid: tmax
                    lon: Lon
                    lat: Lat
                    time: Time
                    prec: float
                    units: °C
                    missval: -99
                    compute: False
                tmin: 
                    dir: /home/aranaivoson/ENACTS/DATA/ENACTS/NETCDF/ALL/tmin_daily
                    format: era5_%Y%m%d.nc
                    name: Daily minimum temperature
                    varid: tmin
                    lon: Lon
                    lat: Lat
                    time: Time
                    prec: float
                    units: °C
                    missval: -99
                    compute: False
                et0: 
                    name: Daily reference evapotranspiration 
                    varid: et0
                    lon: lon
                    lat: lat
                    time: time
                    prec: float
                    units: mm
                    missval: -99
                    compute: True
                    data_type: et0
                    function: et0_hargreaves_modified
                    input_data: [tmax, tmin, precip]
                    # input_data: [tmax, tmin]
                    # function: et0_hargreaves_fao
                    input: daily
                    write_zarr: True
                    dir_zarr: et0_daily
            zarr_dir: /home/aranaivoson/ENACTS/DATA/ENACTS/ZARR/ALL
            chunks:
                time: 1000
                lat: 50
                lon: 50
        dekadal:
            # compute: False
            netcdf:
