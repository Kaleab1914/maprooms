## Shapefiles or GeoJSON of the subdivision
## location (administrative group): true for the subdivision whose polygon name
## is shown as "Located near" in the chart information of a grid point
subdivision:
    woreda:
        file: gadm41_ETH_3.json
        type: geojson
        field: NAME_3
        region: NAME_1
        order: 0
        group: administrative
        location: true
        name:
            en: Woreda
            fr: Woreda
    zone:
        file: gadm41_ETH_2.shp
        type: shapefile
        field: NAME_2
        region: NAME_1
        order: 1
        group: administrative
        location: false
        name:
            en: Zone
            fr: Zone
    region:
        file: gadm41_ETH_1.shp
        type: shapefile
        field: NAME_1
        region: NAME_1
        order: 2
        group: administrative
        location: false
        name:
            en: Region
            fr: Région
    sub_basins:
        file: ethiopa_river_sub_basins.shp
        type: shapefile
        field: sub_basin_
        region: basin_name
        order: 3
        group: whatershed
        name:
            en: Sub basin
            fr: Sous bassin
    basins:
        file: ethiopa_river_basins.shp
        type: shapefile
        field: basinname
        region: basinname
        order: 4
        group: whatershed
        name:
            en: Basin
            fr: Bassin

## default subdivision display
subdivision_sel:
    climate: region
    water: basins
    agriculture: region
    drm: region
    health: region

## Zoom and clip map to a region or basin
subdivision_clip:
    climate: region
    water: basins
    agriculture: region
    drm: region
    health: region

subdivision_map:
    climate: administrative
    water: whatershed
    agriculture: administrative
    drm: administrative
    health: administrative

subdivision_def:
    administrative: [zone, woreda]
    whatershed: [sub_basins]

subdivision_blank_data: region
