<div class="container p-0" id="container-map-navigation">
    <div class="row gap-0 m-0 p-0">
        <div id="div-map-time-navigation" class="col d-flex m-0 p-0">
            <!-- time navigation previous -->
            <div class="col m-0 p-0">
                <button id="prev-time-navigation" class="btns-leaflet-control" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="{{ pageText.tooltip.time_nav_prev }}"><i class="bi bi-arrow-left-square-fill"></i></button>
            </div>
            <!-- time navigation input -->
            <div id="div-input-map-time-navigation" class="col m-0 p-0">
                <input type="text" id="input-time-navigation" class="input-map-time-navigation" size="11">
            </div>
            <!-- time navigation next -->
            <div class="col m-0 p-0">
                <button id="next-time-navigation" class="btns-leaflet-control" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="{{ pageText.tooltip.time_nav_next }}"><i class="bi bi-arrow-right-square-fill"></i></button>
            </div>
        </div>
        <!-- spatial average point or polygon -->
        <div id="div-list-spatial-average" class="col m-0 p-0 div-spatial-average">
            <select id="list-spatial-average" class="form-select form-select2" style="width: 200px;"></select>
        </div>
        <!-- spatial average type -->
        <div id="div-support-spatial-average" class="col m-0 p-0 div-spatial-average">
            <select id="support-spatial-average" class="form-select form-select2-nosearch" style="width: 200px;">
                {% for key, value in pageText.layers.extract_gridpoint.items() %}
                <option value="{{key}}" selected>{{value}}</option>
                {% endfor %}
                {% for gkey, gvalue in pageText.layers.subdivision_group.items() %}
                <optgroup label="{{ gvalue }}">
                    {% for key, value in pageText.layers.subdivision.items() %}
                    {% if value.group == gkey %}
                    <option value="{{key}}">{{value.name}}</option>
                    {% endif %}
                    {% endfor %}
                </optgroup>
                {% endfor %}
            </select>
        </div>
    </div>
</div>
