description:
    en: |
        <h4>Extreme Rainfall Analysis</h4>
        <p>The Maproom facilitates the exploration of the history of extreme monthly and seasonal rainfall characteristics.
        </p>
        <p>The user can define the Season and Seasonal Daily Statistics of interest and then map the probability of non-/exceeding a user-defined threshold. The map therefore illustrates how likely or unlikely the threshold is to be crossed. The user can also look at the variance or coefficient of variation of the seasonal quantity to get a sense of the range of variability across the years. Clicking on the map will then produce the probability of exceeding graph represented by a normal distribution. The graph gives a sense of the range of possible value for the seasonal characteristics of interest, including its extreme values. The different options are detailed below.
        </p> 
        <ul>
            <li><strong>Season</strong>: Specify the start and end dates of the season , over which the rainfall characteristcs are to be computed over the full range of years of data available (1983-2014).</li>
            <li><strong>Wet/Dry Day/Spell Definitions:</strong> These define the amount in millimeters (non inclusive) above which a day is considered to be a wet day (as opposed to dry), and the minimum number (inclusive) of consecutive wet (dry) days to define a wet (dry) spell.</li>
            <li><strong> Seasonal daily statistcis</strong>: Choose the seasonal diagnostic quantity (i.e the statistic of the daily data) to be computed for each season, from the following choices.</li>
            <li><strong> Total Rainfall</strong>: total cumulative precipitation (in mm) falling over the season.</li>
            <li><strong>Number of Wet Days</strong> : the number of wet days (as defined above) during the season.</li>
            <li><strong>Number of Dry Days</strong> : the number of dry days (as defined above) during the season.</li>
            <li><strong> Rainfall Intensity</strong>: the average daily precipitation over the season considering only wet days.</li>
            <li><strong> Number of Wet (Dry) Spells</strong>: the number of wet (dry) spells during the season according to the definitions above. For example, if a wet spell is defined as 5 contiguous wet days, 10 contiguous wet days are counted as 1 wet spell. Note that a spell, according to the definitions above, that is overlapping the start or end of the season will be counted only if the part of the spell that falls within the season reaches the minimal length of consecutive days.</li>
            <li><strong>Yearly seasonal statistics</strong> : choose the threshold to map the probability of non-/exceeding, or look at the variance or the coefficient of variation of the yearly seasonal time series across the 1983-2014 period.</li>
            <li><strong>Probability of non-/exceeding</strong> : the portion of years, in percentage, when the seasonal quantity exceeded or not a given threshold.</li>
            <li><strong>Variance</strong> : a measure of the variability of the seasonal quantity, expressed in square of the units. The higher, the farther the quantity departs from its mean value.
            </li>
            <li><strong> Coefficient of Variation</strong>: the ratio between the standard deviation (square root of the variance) and the mean of the seasonal quantity. It gives similar information as the variance but in perspective with the value of the mean rather than in units of the quantity.</li>
            <li><strong>Spatial Resolution</strong> : The analysis can be done and mapped at each 0.0375 resolution grid point. Additionally it is possible to average the daily rainfall, prior to doing the analysis, over the 0.0375 grid points falling within administrative boundaries for the probability of exceeding graph.</li>
        </ul>

    fr: |
        <h4>Analyse des précipitations extrêmes</h4>
        <p>Le Maproom facilite l’exploration de l’historique des caractéristiques des précipitations extrêmes mensuelles et saisonnières.
        </p>
        <p>L’utilisateur peut définir la saison et les statistiques journalières saisonnières qui l’intéressent, 
        puis cartographier la probabilité de non-dépassement ou de dépassement d’un seuil défini par l’utilisateur. 
        La carte illustre ainsi la probabilité que ce seuil soit franchi ou non. L’utilisateur peut également examiner 
        la variance ou le coefficient de variation de la quantité saisonnière afin d’avoir une idée de l’amplitude de la 
        variabilité d’une année à l’autre. Un clic sur la carte permet ensuite d’afficher le graphique de probabilité de dépassement 
        représenté par une distribution normale. Ce graphique donne une indication de l’intervalle des valeurs possibles pour 
        les caractéristiques saisonnières considérées, y compris leurs valeurs extrêmes. Les différentes options sont détaillées ci-dessous.
        </p> 
        <ul>
            <li><strong>Saison</strong> : Spécifiez les dates de début et de fin de la saison sur laquelle les caractéristiques des précipitations doivent être calculées pour l’ensemble des années de données disponibles (1983-2014).</li>
            <li><strong>Définitions des jours/séquences humides et secs :</strong> Elles définissent la quantité de précipitations en millimètres (seuil non inclusif) 
            au-dessus de laquelle un jour est considéré comme un jour humide (par opposition à un jour sec), ainsi que le nombre minimum (inclusif) 
            de jours humides (secs) consécutifs nécessaire pour définir une séquence humide (sèche).</li>
            <li><strong>Statistiques journalières saisonnières</strong> : Choisissez l’indicateur saisonnier (c’est-à-dire la statistique calculée à partir des données journalières) à calculer pour chaque saison parmi les options suivantes.</li>
            <li><strong>Précipitations totales</strong> : cumul total des précipitations (en mm) au cours de la saison.</li>
            <li><strong>Nombre de jours humides</strong> : nombre de jours humides (selon la définition ci-dessus) au cours de la saison.</li>
            <li><strong>Nombre de jours secs</strong> : nombre de jours secs (selon la définition ci-dessus) au cours de la saison.</li>
            <li><strong>Intensité des précipitations</strong> : précipitation journalière moyenne au cours de la saison, en considérant uniquement les jours humides.</li>
            <li><strong>Nombre de séquences humides (sèches)</strong> : nombre de séquences humides (sèches) au cours de la saison selon les définitions ci-dessus. 
            Par exemple, si une séquence humide est définie comme 5 jours humides consécutifs, 10 jours humides consécutifs sont comptabilisés comme une seule séquence humide. 
            À noter qu’une séquence, selon les définitions ci-dessus, qui chevauche le début ou la fin de la saison ne sera comptabilisée que si la partie de cette séquence 
            comprise dans la saison atteint la durée minimale de jours consécutifs.</li>
            <li><strong>Statistiques saisonnières annuelles</strong> : choisissez le seuil pour cartographier la probabilité de non-dépassement ou de dépassement, 
            ou examinez la variance ou le coefficient de variation de la série chronologique saisonnière annuelle sur la période 1983-2014.</li>
            <li><strong>Probabilité de non-dépassement/dépassement</strong> : proportion des années, exprimée en pourcentage, au cours desquelles la quantité saisonnière 
            a dépassé ou non un seuil donné.</li>
            <li><strong>Variance</strong> : mesure de la variabilité de la quantité saisonnière, exprimée au carré de l’unité utilisée. 
            Plus la variance est élevée, plus les valeurs de la quantité s’écartent de leur valeur moyenne.
            </li>
            <li><strong>Coefficient de variation</strong> : rapport entre l’écart-type (racine carrée de la variance) et la moyenne de la quantité saisonnière. 
            Il fournit une information similaire à celle de la variance, mais en la rapportant à la valeur moyenne plutôt qu’en l’exprimant dans l’unité de la quantité.</li>
            <li><strong>Résolution spatiale</strong> : L’analyse peut être réalisée et cartographiée pour chaque point de grille à une résolution de 0,0375°. 
            Il est également possible de calculer la moyenne des précipitations journalières sur les points de grille de 0,0375° situés à l’intérieur des limites administratives, avant d’effectuer l’analyse, pour le graphique de probabilité de dépassement.</li>
        </ul>
years_range:
    start_year: 1981
    end_year: 2024
    min_year: 30
    
dataset:
    use: ALL
    variables:
        rainfall: [precip]
        
variables:
    label:
        en: Variable
        fr: Variable
    select:
        rainfall:
            en: Rainfall
            fr: Précipitation

opt_season:
    label_year:
        start:
            en: Start year
            fr: Début année
        end:
            en: End year
            fr: Fin année
    label_season:
        start:
            en: Start season
            fr: Début saison
        end:
            en: End season
            fr: Fin saison
opt_season_map:
    label_season:
        en: Season
        fr: Saison
    label_year:
        en: Years
        fr: Années
    start_date:
        en: Start
        fr: Début
    end_date:
        en: End
        fr: Fin
    min_year:
        en: Minimum number of years
        fr: Nombre minimum d'années
    disp_year:
        en: Display year
        fr: Afficher année

parameters:
    TotRain:
        select:
            en: Total rainfall
            fr: Cumul de précipitations
        unit:
            en: mm
            fr: mm
        value: 500
        dtype: float
    NumWD:
        select:
            en: Number of wet days
            fr: Nombre des jours de pluies
        unit:
            en: days
            fr: jours
        value: 30
        dtype: integer
    NumDD:
        select:
            en: Number of dry days
            fr: Nombre des jours secs
        unit:
            en: days
            fr: jours
        value: 30
        dtype: integer
    RainInt:
        select:
            en: Rainfall intensity
            fr: Intensité des pluies
        unit:
            en: mm/day
            fr: mm/jour
        value: 10
        dtype: float
    NumDS:
        select:
            en: Number of dry spells
            fr: Nombre de périodes sèches
        unit:
            en: spells
            fr: périodes
        value: 3
        dtype: integer
    NumWS:
        select:
            en: Number of wet spells
            fr: Nombre de périodes pluvieuses
        unit:
            en: spells
            fr: périodes
        value: 3
        dtype: integer

parameters_order: [TotRain, NumWD, NumDD, RainInt, NumDS, NumWS]

definition:
    number:
        label:
            en: Wet/Dry day definition
            fr: Définition d'un jour pluvieux/sec
        text:
            en: Rainfall amount above/below
            fr: Cumul de précipitations au-dessus/en-dessous de
        unit: 
            en: mm/day
            fr: mm/jour
        value: 1
    spell:
        label:
            en: Wet/Dry spell definition
            fr: Définition de périodes pluvieuses/sèches
        text:
            en: continuous wet/dry days
            fr: jours pluvieux/secs de suite
        value: 7

label_statistics:
    params:
        en: Seasonal statistics
        fr: Statistique saisonnières
    stats:
        en: Yearly seasonal statistics
        fr: Statistiques saisonnières annuelles
seasonal_statistics:
        stdev:
            en: Standard deviation
            fr: Écart type
        cv:
            en: Coefficient of variation
            fr: Coefficient de variation
        probExc:
            en: Probability of exceeding
            fr: Probabilité de dépassement
        probNoExc:
            en: Probability of non-exceeding
            fr: Probabilité de non-dépassement
probabilities:
    thres:
