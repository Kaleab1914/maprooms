            fr: Probabilité de dépassement
        probNoExc:
            en: Probability of non-exceeding
            fr: Probabilité de non-dépassement
        stdev:
            en: Standard deviation
            fr: Écart type
        cv:
            en: Coefficient of variation
            fr: Coefficient de variation

probabilities:
    thres:
        en: Threshold
        fr: Seuil
    unit:
        en: Probability units
        fr: Unités de probabilité
    select:
        perc:
            en: Percentage
            fr: Pourcentage
        frac:
            en: Fraction
            fr: Fraction

