description:
    en: |
        <h4>SPI</h4>
        <p>
        The Standardized Precipitation Index is an indicator of extreme rainfall events, whether they are drought or excess rainfall.

        <p>The SPI map displays the standard rainfall index of the most recent season of rainfall (using 1981 to the latest complete year as base period). The default SPI shown is the 3-month SPI but the length of the SPI period can be changed in the Control Bar (typically from 1 to 12 months).</p>
        <p>The SPI (McKee 1993) is the number of standard deviations that observed cumulative rainfall deviates from the climatological average. To compute the index, a long-term time series of rainfall accumulations over months are used to estimate an appropriate probability density function. The analyses shown here are based on the Pearson Type III distribution (i.e., 3-parameter gamma) as suggested by Guttman (1999). The associated cumulative probability distribution is then estimated and subsequently transformed to a normal distribution. The result is the SPI, which can be interpreted as a probability using the standard normal distrubtion (i.e., users can expect the SPI be within one standard deviation about 68% of the time, two standard deviations about 95% of the time, etc.) The analyses shown here utilize the FORTRAN code made available by Guttman (1999).</p>
        <p>In seasons when it rains too little, the gamma distribution can not fit and a dry mask is applied. </p>
        <p>Clicking on the map will pop-up a local time series at the 0.0375˚ gridbox clicked. Users can also choose to spatially average the SPI over Districts, Regions or Countries, by clicking on the map or picking an administrative name in the drop-down list, once having chosen which level of administration. Users can also focus the time series on a small time period by using the menu in the Control Bar.</p>
        <p>Note that the time series bars are 1 month wide regardless of the SPI length chosen to ease readability. The SPI for a given season is drawn for the last month of that season. E.g. if the SPI length is 4 months, the Sep-Dec 2016 SPI is drawn in drawn on Dec 2016.</p></p>
    fr: |
        <h4>SPI</h4>
        <p>
        L’indice standardisé de précipitation est un indicateur des événements pluviométriques extrêmes, qu’il s’agisse de sécheresse ou d’excès de précipitations.

        <p>La carte du SPI affiche l’indice standardisé de précipitation de la saison pluviométrique la plus récente (en utilisant la période allant de 1981 jusqu’à la dernière année complète comme période de référence). Par défaut, le SPI affiché est le SPI sur 3 mois, mais la durée de la période du SPI peut être modifiée dans la barre de contrôle (généralement de 1 à 12 mois).</p>
        <p>Le SPI (McKee 1993) correspond au nombre d’écarts-types séparant les précipitations cumulées observées de la moyenne climatologique. Pour calculer cet indice, une longue série chronologique de cumuls de précipitations mensuelles est utilisée afin d’estimer une fonction de densité de probabilité appropriée. Les analyses présentées ici sont basées sur la distribution de Pearson de type III (c’est-à-dire une distribution gamma à 3 paramètres), comme suggéré par Guttman (1999). La distribution de probabilité cumulative associée est ensuite estimée puis transformée en distribution normale. Le résultat obtenu est le SPI, qui peut être interprété comme une probabilité à l’aide de la distribution normale standard (par exemple, les utilisateurs peuvent s’attendre à ce que le SPI se situe à moins d’un écart-type environ 68 % du temps, à moins de deux écarts-types environ 95 % du temps, etc.). Les analyses présentées ici utilisent le code FORTRAN mis à disposition par Guttman (1999).</p>
        <p>Pour les saisons où les précipitations sont trop faibles, la distribution gamma ne peut pas être ajustée et un masque de sécheresse est appliqué. </p>
        <p>Un clic sur la carte affiche une série chronologique locale correspondant au point de grille de 0,0375˚ sélectionné. Les utilisateurs peuvent également choisir de calculer la moyenne spatiale du SPI sur des districts, des régions ou des pays, soit en cliquant sur la carte, soit en sélectionnant le nom d’une unité administrative dans la liste déroulante, après avoir choisi le niveau administratif souhaité. Les utilisateurs peuvent également limiter la série chronologique à une période plus courte à l’aide du menu de la barre de contrôle.</p>
        <p>À noter que les barres des séries chronologiques ont une largeur d’un mois, quelle que soit la durée du SPI choisie, afin d’en faciliter la lecture. Le SPI d’une saison donnée est représenté au niveau du dernier mois de cette saison. Par exemple, si la durée du SPI est de 4 mois, le SPI de septembre à décembre 2016 est représenté en décembre 2016.</p></p>

years_range:
    start_year: 1981
    end_year: 2024
    min_year: 30
    
dataset:
    use: MON
    variables:
        rainfall: [precip]
        rain_seas: [precip]
        spi_mon: [precip]
        spei_mon: [precip, et0]
        spi_seas: [precip]
        spei_seas: [precip, et0]

