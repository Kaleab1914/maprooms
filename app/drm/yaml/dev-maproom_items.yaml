title: 
    en: Disaster Risk Management
    fr: Gestion des risques et de catastrophe
description: 
    en: |
        <p>
        The <strong>Disaster Risk Management Maproom</strong> enables users to access, analyze, and visualize climate information across the past, present, and future to support evidence-based decision-making. 
        </p>
        <p>
        Through its <strong>Risk Analysis</strong> products, users can explore historical climate conditions, variability, and trends using high-resolution datasets and a wide range of climate indicators.
        </p>
        <p>
        The <strong>Risk Monitoring</strong> products provide near-real-time information on current risk conditions, allowing users to track potential disasters, vulnerability factors, and other risk-related phenomena as they evolve. 
        </p>
        <p>
        Looking ahead, the <strong>Risk anticipation</strong> products offer access to seasonal climate forecasts and long-term climate change projections, helping users anticipate future conditions and plan accordingly.
        </p>
    fr: |
        <p>
        La <strong>Maproom Climat</strong> permet aux utilisateurs d’accéder aux informations climatiques passées, présentes et futures, de les analyser et de les visualiser afin de soutenir une prise de décision fondée sur des données probantes.
        </p>
        <p>
        Grâce aux produits d’<strong>Analyse des Risques</strong>, les utilisateurs peuvent explorer les conditions de risque historiques, leur variabilité et leurs tendances à partir de jeux de données à haute résolution et d’un large éventail d’indicateurs de risque.
        </p>
        <p>
        Les produits de <strong>Suivi des risques</strong> fournissent des informations en temps quasi réel sur les conditions de risque actuelles. Ils permettent de suivre l’évolution des catastrophes, des facteurs de vulnérabilité et d’autres phénomènes liés aux risques.
        </p>
        <p>
        Enfin, les produits de <strong>Anticipation des risques </strong> donnent accès aux prévisions climatiques saisonnières ainsi qu’aux projections à long terme du changement climatique. Ils aident ainsi les utilisateurs à anticiper les conditions futures et à planifier leurs actions en conséquence.
        </p>
type: navigation-card
